<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHRLE 🌍 Guess the Daily High</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,300&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0c1021;
            --bg2: #141829;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.07);
            --border: rgba(255,255,255,0.08);
            --border-active: rgba(255,255,255,0.18);
            --text: #e8e6f0;
            --text-dim: rgba(232,230,240,0.4);
            --text-mid: rgba(232,230,240,0.65);
            --accent: #fbbf24;
            --accent-dim: rgba(251,191,36,0.12);
            --accent-glow: rgba(251,191,36,0.25);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --yellow: #fbbf24;
            --yellow-dim: rgba(251,191,36,0.12);
            --red: #f87171;
            --red-dim: rgba(248,113,113,0.12);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* ── Animated sky canvas ── */
        #sky-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 18px 80px;
        }

        /* ── Top Bar ── */
        .top-bar {
            width: 100vw;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-dim);
        }
        .top-bar .loc { display: flex; align-items: center; gap: 6px; }
        .top-bar .loc .pulse-dot {
            width: 5px; height: 5px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .top-bar .loc-name { color: var(--text-mid); font-weight: 600; }
        .top-bar .loc-weather { color: var(--text); font-weight: 700; font-size: 0.8rem; }
        .top-bar .right-info { text-align: right; line-height: 1.5; }

        /* ── Header ── */
        .brand {
            margin-top: 32px;
            text-align: center;
        }
        .brand h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand .tagline {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 3.5px;
            color: var(--text-dim);
            margin-top: 6px;
            font-weight: 500;
        }

        /* ── Unit + Streak Row ── */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 22px 0 8px;
            width: 100%;
        }
        .unit-toggle {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .unit-btn {
            padding: 7px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            border: none;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
        .unit-btn.active { background: var(--accent); color: #000; }
        .unit-btn:not(.active):hover { background: var(--surface-hover); color: var(--text-mid); }

        .streak-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-mid);
        }
        .streak-badge .fire { font-size: 0.85rem; }
        .streak-badge .streak-num {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            color: var(--accent);
        }

        .section-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-dim);
            font-weight: 600;
            margin: 18px 0 14px;
            text-align: center;
        }

        /* ── City Cards ── */
        .card {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 10px;
            transition: all 0.35s ease;
            animation: slideUp 0.45s ease-out backwards;
        }
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.15s; }
        .card:nth-child(3) { animation-delay: 0.25s; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card.revealed.exact  { border-color: var(--accent); background: var(--accent-dim); }
        .card.revealed.close  { border-color: var(--green); background: var(--green-dim); }
        .card.revealed.warm   { border-color: var(--yellow); background: var(--yellow-dim); }
        .card.revealed.off    { border-color: var(--red); background: var(--red-dim); }
        .card.revealed.far    { border-color: var(--border); }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .city-id {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .flag {
            font-size: 1.6rem;
            line-height: 1;
            flex-shrink: 0;
        }
        .city-text { min-width: 0; }
        .city-text .name {
            font-weight: 700;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .city-text .country-code {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            margin-top: 1px;
        }

        .temp-input-wrap {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px 12px;
            gap: 2px;
            transition: border-color 0.2s;
            flex-shrink: 0;
        }
        .temp-input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .temp-input {
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 800;
            width: 60px;
            text-align: right;
        }
        .temp-input::placeholder { color: rgba(255,255,255,0.15); }
        .temp-input:disabled { opacity: 0.6; }
        .deg {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-dim);
        }

        /* ── Reveal Row ── */
        .card-reveal {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        .card-reveal.show {
            max-height: 80px;
            opacity: 1;
            margin-top: 12px;
        }
        .reveal-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
        }
        .reveal-actual {
            font-weight: 700;
            color: var(--text);
        }
        .reveal-detail {
            color: var(--text-mid);
            font-size: 0.72rem;
        }
        .diff-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }
        .diff-pill.exact { background: var(--accent); color: #000; }
        .diff-pill.close { background: var(--green); color: #000; }
        .diff-pill.warm  { background: var(--yellow); color: #000; }
        .diff-pill.off   { background: var(--red); color: #fff; }
        .diff-pill.far   { background: rgba(255,255,255,0.1); color: var(--text-dim); }

        /* Hint row */
        .hint-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
        .hint-tag {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: var(--text-mid);
            font-weight: 500;
        }

        /* ── Submit ── */
        .btn-go {
            width: 100%;
            margin-top: 18px;
            padding: 17px;
            border: none;
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            color: #000;
            box-shadow: 0 6px 24px rgba(251,191,36,0.2);
        }
        .btn-go:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(251,191,36,0.3); }
        .btn-go:active { transform: translateY(0); }

        /* ── Results Area ── */
        #results-area {
            display: none;
            width: 100%;
            text-align: center;
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }

        .emoji-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 8px 0 20px;
        }
        .emoji-tile {
            font-size: 2.8rem;
            animation: pop 0.35s cubic-bezier(0.175,0.885,0.32,1.275) backwards;
        }
        .emoji-tile:nth-child(1) { animation-delay: 0.1s; }
        .emoji-tile:nth-child(2) { animation-delay: 0.3s; }
        .emoji-tile:nth-child(3) { animation-delay: 0.5s; }
        @keyframes pop { from{opacity:0;transform:scale(0.2)} to{opacity:1;transform:scale(1)} }

        .legend {
            display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
            margin-bottom: 22px;
        }
        .legend span {
            font-size: 0.62rem; color: var(--text-dim);
            display: flex; align-items: center; gap: 4px;
        }
        .legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

        .btn-copy {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-copy:hover { background: var(--surface-hover); border-color: var(--border-active); }

        /* ── Countdown ── */
        .countdown {
            margin-top: 18px;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
        }
        .countdown .time {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--text-mid);
            font-size: 0.85rem;
        }

        .hidden { display: none !important; }

        #loading {
            padding: 60px 20px;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

<canvas id="sky-canvas"></canvas>

<div class="top-bar">
    <div class="loc">
        <span id="local-info">📍 Locating...</span>
    </div>
    <div class="right-info" id="local-weather"></div>
</div>

<div class="app">
    <div class="brand">
        <h1>WEATHRLE</h1>
        <div class="tagline">Guess today's high temperature</div>
    </div>

    <div class="controls-row">
        <div class="unit-toggle">
            <button class="unit-btn active" id="btn-c" onclick="setUnit('C')">°C</button>
            <button class="unit-btn" id="btn-f" onclick="setUnit('F')">°F</button>
        </div>
        <div class="streak-badge">
            <span class="fire">🔥</span>
            <span>Streak</span>
            <span class="streak-num" id="streak-num">0</span>
        </div>
    </div>

    <div class="section-label" id="section-label">Today's Cities</div>

    <div id="game-area" style="width:100%;">
        <div id="loading">🌍 Finding cities around the globe...</div>
        <div id="cards"></div>
        <button class="btn-go hidden" id="btn-submit" onclick="submitGuesses()">Submit Guesses</button>
    </div>

    <div id="results-area">
        <div class="section-label">Your Score</div>
        <div class="emoji-row" id="emoji-row"></div>
        <div class="legend" id="legend"></div>
        <button class="btn-copy" onclick="copyScore()">Copy Score 📋</button>
        <div class="countdown" id="countdown"></div>
    </div>
</div>

<script>
// ──────────────────────────────────────────
// Sky background — gentle floating particles
// ──────────────────────────────────────────
(function() {
    const c = document.getElementById('sky-canvas');
    const ctx = c.getContext('2d');
    let w, h, particles = [];

    function resize() {
        w = c.width = window.innerWidth;
        h = c.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 50; i++) {
        particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.5 + 0.5,
            dx: (Math.random() - 0.5) * 0.3,
            dy: (Math.random() - 0.5) * 0.2,
            o: Math.random() * 0.3 + 0.05
        });
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);

        // Subtle gradient glow
        const g1 = ctx.createRadialGradient(w * 0.7, h * 0.2, 0, w * 0.7, h * 0.2, w * 0.5);
        g1.addColorStop(0, 'rgba(251,191,36,0.04)');
        g1.addColorStop(1, 'transparent');
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, w, h);

        const g2 = ctx.createRadialGradient(w * 0.2, h * 0.8, 0, w * 0.2, h * 0.8, w * 0.4);
        g2.addColorStop(0, 'rgba(99,102,241,0.04)');
        g2.addColorStop(1, 'transparent');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, w, h);

        particles.forEach(p => {
            p.x += p.dx;
            p.y += p.dy;
            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${p.o})`;
            ctx.fill();
        });

        requestAnimationFrame(draw);
    }
    draw();
})();

// ──────────────────────────────────────────
// Constants & State
// ──────────────────────────────────────────
const CITIES_URL = 'https://raw.githubusercontent.com/lutangar/cities.json/master/cities.json';

const WMO = {
    0:{i:"☀️",d:"Clear sky"},1:{i:"🌤️",d:"Mostly clear"},2:{i:"⛅",d:"Partly cloudy"},
    3:{i:"☁️",d:"Overcast"},45:{i:"🌫️",d:"Fog"},48:{i:"🌫️",d:"Freezing fog"},
    51:{i:"🌦️",d:"Light drizzle"},53:{i:"🌦️",d:"Drizzle"},55:{i:"🌧️",d:"Heavy drizzle"},
    56:{i:"🌧️",d:"Freezing drizzle"},57:{i:"🌧️",d:"Heavy freezing drizzle"},
    61:{i:"🌧️",d:"Light rain"},63:{i:"🌧️",d:"Rain"},65:{i:"🌧️",d:"Heavy rain"},
    66:{i:"🌧️",d:"Freezing rain"},67:{i:"🌧️",d:"Heavy freezing rain"},
    71:{i:"🌨️",d:"Light snow"},73:{i:"🌨️",d:"Snow"},75:{i:"❄️",d:"Heavy snow"},
    77:{i:"❄️",d:"Hail"},80:{i:"🌦️",d:"Light showers"},81:{i:"🌧️",d:"Showers"},
    82:{i:"🌧️",d:"Heavy showers"},85:{i:"🌨️",d:"Light snow showers"},86:{i:"🌨️",d:"Heavy snow showers"},
    95:{i:"⛈️",d:"Thunderstorm"},96:{i:"⛈️",d:"Thunder + hail"},99:{i:"⛈️",d:"Severe thunderstorm"}
};
function wmo(code) { return WMO[code] || {i:"🌤️",d:"No data"}; }

// Country name lookup for common codes
const COUNTRY_NAMES = {
    US:"United States",GB:"United Kingdom",FR:"France",DE:"Germany",BR:"Brazil",
    JP:"Japan",CN:"China",IN:"India",AU:"Australia",CA:"Canada",MX:"Mexico",
    RU:"Russia",ZA:"South Africa",NG:"Nigeria",EG:"Egypt",KR:"South Korea",
    AR:"Argentina",CL:"Chile",CO:"Colombia",PE:"Peru",IT:"Italy",ES:"Spain",
    PT:"Portugal",NL:"Netherlands",BE:"Belgium",SE:"Sweden",NO:"Norway",
    FI:"Finland",DK:"Denmark",PL:"Poland",GR:"Greece",TR:"Turkey",TH:"Thailand",
    ID:"Indonesia",MY:"Malaysia",PH:"Philippines",VN:"Vietnam",PK:"Pakistan",
    BD:"Bangladesh",NZ:"New Zealand",IE:"Ireland",AT:"Austria",CH:"Switzerland",
    CZ:"Czech Republic",HU:"Hungary",RO:"Romania",UA:"Ukraine",SA:"Saudi Arabia",
    AE:"UAE",IL:"Israel",KE:"Kenya",GH:"Ghana",TZ:"Tanzania",MA:"Morocco",
    TN:"Tunisia",SN:"Senegal",CI:"Ivory Coast",CM:"Cameroon"
};
function countryName(code) {
    if (!code) return "";
    return COUNTRY_NAMES[code.toUpperCase()] || code.toUpperCase();
}

let unit = localStorage.getItem('weathrle_unit') || 'C';
let cities = [], weather = [];
let localData = null;
let played = false;
const today = new Date().toDateString();

function c2f(c) { return Math.round(c * 9/5 + 32); }
function f2c(f) { return Math.round((f - 32) * 5/9); }
function dT(c) { return unit === 'F' ? c2f(c) : c; }
function uL() { return unit === 'F' ? '°F' : '°C'; }

function flag(cc) {
    if (!cc || cc.length !== 2) return "🌍";
    const upper = cc.toUpperCase();
    const cp1 = 0x1F1E6 - 65 + upper.charCodeAt(0);
    const cp2 = 0x1F1E6 - 65 + upper.charCodeAt(1);
    return String.fromCodePoint(cp1, cp2);
}

function setUnit(u) {
    unit = u;
    localStorage.setItem('weathrle_unit', u);
    document.getElementById('btn-c').classList.toggle('active', u === 'C');
    document.getElementById('btn-f').classList.toggle('active', u === 'F');
    refreshLocalBar();
    if (played || localStorage.getItem('weathrle_date') === today) {
        restoreResults();
    }
}

// ── Streak ──
function getStreak() { return parseInt(localStorage.getItem('weathrle_streak') || '0'); }
function updateStreakDisplay() { document.getElementById('streak-num').textContent = getStreak(); }

// ── Local weather ──
function refreshLocalBar() {
    if (!localData) return;
    const d = localData;
    document.getElementById('local-weather').innerHTML =
        `<span class="loc-weather">${d.icon} ${dT(d.min)}°/${dT(d.max)}${uL()}</span><br><span style="font-size:0.68rem">${d.desc}</span>`;
}

// ── PRNG ──
function prng(seed) {
    return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
function haversine(a, b, c, d) {
    const R=6371, dLat=(c-a)*Math.PI/180, dLon=(d-b)*Math.PI/180;
    const x = Math.sin(dLat/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function pickCities(all) {
    const n = new Date();
    const rng = prng(n.getFullYear()*10000 + (n.getMonth()+1)*100 + n.getDate());
    const valid = all.filter(c => c.country && c.lat && c.lng && c.name);
    const shuffled = valid.slice().sort(() => rng() - 0.5);
    const picked = [], used = new Set();
    for (const c of shuffled) {
        const cc = c.country.toUpperCase();
        if (used.has(cc)) continue;
        if (picked.some(p => haversine(c.lat, c.lng, p.lat, p.lng) < 2000)) continue;
        picked.push(c);
        used.add(cc);
        if (picked.length === 3) break;
    }
    return picked;
}

async function fetchW(lat, lon) {
    try {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`);
        const d = await r.json();
        const code = d.daily.weathercode[0];
        const info = wmo(code);
        return { max: Math.round(d.daily.temperature_2m_max[0]), min: Math.round(d.daily.temperature_2m_min[0]), icon: info.i, desc: info.d };
    } catch { return { max: 0, min: 0, icon: "❓", desc: "No data" }; }
}

// ── Climate hint based on latitude ──
function climateHint(lat) {
    const absLat = Math.abs(parseFloat(lat));
    if (absLat < 15) return "🌴 Tropical";
    if (absLat < 30) return "☀️ Subtropical";
    if (absLat < 50) return "🍃 Temperate";
    if (absLat < 66) return "🌲 Continental";
    return "🧊 Polar";
}
function hemisphereHint(lat) {
    return parseFloat(lat) >= 0 ? "🌐 Northern Hemisphere" : "🌐 Southern Hemisphere";
}

// ── Input: block "e", allow only digits and minus ──
function sanitizeInput(el) {
    el.addEventListener('keydown', function(e) {
        // Allow: backspace, delete, tab, escape, enter, arrows
        if ([8, 9, 27, 13, 46, 37, 38, 39, 40].includes(e.keyCode)) return;
        // Allow minus only at start
        if (e.key === '-' && el.value === '' && el.selectionStart === 0) return;
        // Allow digits
        if (e.key >= '0' && e.key <= '9') return;
        // Block everything else (including 'e', 'E', '.', '+')
        e.preventDefault();
    });
    // Also block paste of non-numeric
    el.addEventListener('input', function() {
        el.value = el.value.replace(/[^0-9\-]/g, '');
        // Only allow minus at start
        if (el.value.indexOf('-') > 0) {
            el.value = el.value.replace(/-/g, '');
        }
        // Prevent multiple minuses
        if ((el.value.match(/-/g) || []).length > 1) {
            el.value = '-' + el.value.replace(/-/g, '');
        }
    });
}

// ──────────────────────────────────────────
// Init
// ──────────────────────────────────────────
async function init() {
    setUnit(unit);
    updateStreakDisplay();

    // Geolocation
    navigator.geolocation.getCurrentPosition(async pos => {
        const {latitude: lat, longitude: lon} = pos.coords;
        const d = await fetchW(lat, lon);
        localData = d;
        let name = "Your location";
        try {
            const r = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1`);
            const j = await r.json();
            if (j.results?.[0]) name = j.results[0].name;
        } catch {}
        document.getElementById('local-info').innerHTML = `<span class="pulse-dot"></span> <span class="loc-name">📍 ${name}</span>`;
        refreshLocalBar();
    }, () => {
        document.getElementById('local-info').innerHTML = '📍 Enable GPS for local weather';
    });

    // Already played?
    if (localStorage.getItem('weathrle_date') === today) {
        restoreResults();
        return;
    }

    // Load cities
    try {
        const res = await fetch(CITIES_URL);
        const all = await res.json();
        const chosen = pickCities(all);
        const container = document.getElementById('cards');

        for (let i = 0; i < chosen.length; i++) {
            const city = chosen[i];
            cities.push(city);
            const w = await fetchW(city.lat, city.lng);
            weather.push(w);

            const div = document.createElement('div');
            div.className = 'card';
            div.id = `card-${i}`;
            div.innerHTML = `
                <div class="card-top">
                    <div class="city-id">
                        <span class="flag">${flag(city.country)}</span>
                        <div class="city-text">
                            <span class="name">${city.name}</span>
                            <span class="country-code">${countryName(city.country)}</span>
                        </div>
                    </div>
                    <div class="temp-input-wrap">
                        <input type="text" class="temp-input" id="input-${i}" placeholder="—" inputmode="numeric" maxlength="4" autocomplete="off">
                        <span class="deg">°</span>
                    </div>
                </div>
                <div class="hint-row">
                    <span class="hint-tag">${climateHint(city.lat)}</span>
                    <span class="hint-tag">${hemisphereHint(city.lat)}</span>
                </div>
                <div class="card-reveal" id="reveal-${i}"></div>
            `;
            container.appendChild(div);
            sanitizeInput(document.getElementById(`input-${i}`));
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('btn-submit').classList.remove('hidden');
    } catch (e) {
        document.getElementById('loading').textContent = "Connection error. Please refresh.";
        console.error(e);
    }
}

// ──────────────────────────────────────────
// Scoring
// ──────────────────────────────────────────
function diffClass(d) {
    if (d === 0) return 'exact';
    if (d <= 2) return 'close';
    if (d <= 5) return 'warm';
    if (d <= 10) return 'off';
    return 'far';
}
function diffEmoji(d) {
    if (d === 0) return '🌟';
    if (d <= 2) return '🟩';
    if (d <= 5) return '🟨';
    if (d <= 10) return '🟥';
    return '⬛';
}

function submitGuesses() {
    const emojis = [];

    for (let i = 0; i < 3; i++) {
        const raw = document.getElementById(`input-${i}`).value.trim();
        if (raw === '' || raw === '-') { alert("Please fill in all guesses!"); return; }
        const guessInUnit = parseInt(raw);
        if (isNaN(guessInUnit)) { alert("Please enter valid numbers!"); return; }

        const guessCelsius = unit === 'F' ? f2c(guessInUnit) : guessInUnit;
        const actual = weather[i].max;
        const diff = Math.abs(guessCelsius - actual);
        const cls = diffClass(diff);
        emojis.push(diffEmoji(diff));

        const actualInUnit = dT(actual);
        const diffInUnit = guessInUnit - actualInUnit;

        const badge = diff === 0 ? 'EXACT!' : (diffInUnit > 0 ? '+' : '') + diffInUnit + '°';

        const reveal = document.getElementById(`reveal-${i}`);
        reveal.innerHTML = `
            <div class="reveal-row">
                <div>
                    <span class="reveal-actual">${weather[i].icon} Actual: ${dT(actual)}${uL()}</span>
                    <span class="reveal-detail"> · Low: ${dT(weather[i].min)}${uL()} · ${weather[i].desc}</span>
                </div>
                <span class="diff-pill ${cls}">${badge}</span>
            </div>
        `;
        reveal.classList.add('show');

        document.getElementById(`card-${i}`).classList.add('revealed', cls);
        document.getElementById(`input-${i}`).disabled = true;
    }

    played = true;
    document.getElementById('btn-submit').classList.add('hidden');

    const score = emojis.join('');
    localStorage.setItem('weathrle_date', today);
    localStorage.setItem('weathrle_score', score);

    // Update streak
    const lastDate = localStorage.getItem('weathrle_last_date');
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    let streak = getStreak();
    if (lastDate === yesterday || !lastDate) {
        streak++;
    } else if (lastDate !== today) {
        streak = 1;
    }
    localStorage.setItem('weathrle_streak', streak.toString());
    localStorage.setItem('weathrle_last_date', today);
    updateStreakDisplay();

    const saved = cities.map((c, i) => ({
        name: c.name, country: c.country, lat: c.lat,
        gC: unit === 'F' ? f2c(parseInt(document.getElementById(`input-${i}`).value)) : parseInt(document.getElementById(`input-${i}`).value),
        max: weather[i].max, min: weather[i].min, icon: weather[i].icon, desc: weather[i].desc
    }));
    localStorage.setItem('weathrle_cities', JSON.stringify(saved));

    setTimeout(() => showResults(score), 1000);
}

function restoreResults() {
    played = true;
    updateStreakDisplay();
    const score = localStorage.getItem('weathrle_score') || '';
    const saved = JSON.parse(localStorage.getItem('weathrle_cities') || '[]');

    const container = document.getElementById('cards');
    container.innerHTML = '';

    for (let i = 0; i < saved.length; i++) {
        const c = saved[i];
        const diff = Math.abs(c.gC - c.max);
        const cls = diffClass(diff);
        const gInUnit = dT(c.gC);
        const aInUnit = dT(c.max);
        const dInUnit = gInUnit - aInUnit;
        const badge = diff === 0 ? 'EXACT!' : (dInUnit > 0 ? '+' : '') + dInUnit + '°';

        const div = document.createElement('div');
        div.className = `card revealed ${cls}`;
        div.innerHTML = `
            <div class="card-top">
                <div class="city-id">
                    <span class="flag">${flag(c.country)}</span>
                    <div class="city-text">
                        <span class="name">${c.name}</span>
                        <span class="country-code">${countryName(c.country)}</span>
                    </div>
                </div>
                <div class="temp-input-wrap">
                    <input type="text" class="temp-input" value="${gInUnit}" disabled>
                    <span class="deg">°</span>
                </div>
            </div>
            <div class="hint-row">
                <span class="hint-tag">${climateHint(c.lat)}</span>
                <span class="hint-tag">${hemisphereHint(c.lat)}</span>
            </div>
            <div class="card-reveal show" id="reveal-${i}">
                <div class="reveal-row">
                    <div>
                        <span class="reveal-actual">${c.icon} Actual: ${dT(c.max)}${uL()}</span>
                        <span class="reveal-detail"> · Low: ${dT(c.min)}${uL()} · ${c.desc}</span>
                    </div>
                    <span class="diff-pill ${cls}">${badge}</span>
                </div>
            </div>
        `;
        container.appendChild(div);
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-submit').classList.add('hidden');
    showResults(score);
}

function showResults(score) {
    document.getElementById('section-label').textContent = "Today's Result";
    document.getElementById('results-area').style.display = 'block';

    const row = document.getElementById('emoji-row');
    row.innerHTML = Array.from(score).map(e => `<span class="emoji-tile">${e}</span>`).join('');

    document.getElementById('legend').innerHTML = `
        <span><span class="dot" style="background:var(--accent)"></span> Exact</span>
        <span><span class="dot" style="background:var(--green)"></span> ±2°</span>
        <span><span class="dot" style="background:var(--yellow)"></span> ±5°</span>
        <span><span class="dot" style="background:var(--red)"></span> ±10°</span>
        <span><span class="dot" style="background:rgba(255,255,255,0.12)"></span> >10°</span>
    `;

    // Countdown to midnight
    function tick() {
        const now = new Date();
        const midnight = new Date(now);
        midnight.setHours(24, 0, 0, 0);
        const diff = midnight - now;
        const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        document.getElementById('countdown').innerHTML = `Next challenge in <span class="time">${h}:${m}:${s}</span>`;
    }
    tick();
    setInterval(tick, 1000);

    if (score === '🌟🌟🌟') {
        confetti({ particleCount: 250, spread: 100, origin: { y: 0.55 } });
    }
}

function copyScore() {
    const score = localStorage.getItem('weathrle_score') || '';
    const streak = getStreak();
    const msg = score === '🌟🌟🌟' ? '🏆 Perfect score!' : 'My WEATHRLE today:';
    navigator.clipboard.writeText(`${msg}\n\n${score}\n\n🔥 Streak: ${streak}\nhttps://weathrle.com`).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.textContent = 'Copied! ✅';
        setTimeout(() => btn.textContent = 'Copy Score 📋', 2000);
    });
}

init();
</script>
