<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHRLE 🌍 Guess the Daily High</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,300&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #f4f4f8;
            --bg-dark: #e9eaf0;
            --text: #2c3e50;
            --text-dim: #6a7280;
            --accent: #3498db;
            --accent-light: #5dade2;
            --border: #d1d5db;
            --surface: #ffffff;
            --radius: 12px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-dark) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
        }

        .app {
            background: var(--surface);
            width: 100%;
            max-width: 420px;
            margin: 20px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .top-bar {
            background: var(--accent);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            text-align: center;
            margin: 20px 0;
        }

        .card {
            background: white;
            border: 1px solid var(--border);
            margin: 10px;
            border-radius: var(--radius);
            padding: 15px;
            transition: all 0.3s ease;
        }

        .game-footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: var(--text-dim);
            background: var(--bg-dark);
            width: 100%;
        }

        .game-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .game-footer a:hover {
            text-decoration: underline;
        }

        /* Resto do CSS original mantido... */
    </style>
</head>
<body>
    <!-- Conteúdo original mantido -->
    <div class="app">
        <!-- Conteúdo original -->
    </div>

    <footer class="game-footer">
        <p>Built with ❤️ by an environmental engineer, father, and climate optimist. 
        This month, help protect our planet: 
        <a href="https://www.rainforest-alliance.org/get-involved/?campaign=669244" target="_blank">Support Rainforest Alliance</a></p>
    </footer>

    <script>
        // Country names defined BEFORE any modification
        const COUNTRY_NAMES = {
            US: "United States", GB: "United Kingdom", FR: "France", 
            DE: "Germany", BR: "Brazil", JP: "Japan", CN: "China", 
            IN: "India", AU: "Australia", CA: "Canada", MX: "Mexico",
            RU: "Russia", ZA: "South Africa", NG: "Nigeria", 
            EG: "Egypt", KR: "South Korea", AR: "Argentina", 
            CL: "Chile", CO: "Colombia", PE: "Peru", IT: "Italy", 
            ES: "Spain", PT: "Portugal", NL: "Netherlands", 
            BE: "Belgium", SE: "Sweden", NO: "Norway", FI: "Finland", 
            DK: "Denmark", PL: "Poland", GR: "Greece", TR: "Turkey", 
            TH: "Thailand", ID: "Indonesia", MY: "Malaysia", 
            PH: "Philippines", VN: "Vietnam", PK: "Pakistan", 
            BD: "Bangladesh", NZ: "New Zealand", IE: "Ireland", 
            AT: "Austria", CH: "Switzerland", CZ: "Czech Republic", 
            HU: "Hungary", RO: "Romania", UA: "Ukraine", 
            SA: "Saudi Arabia", AE: "UAE", IL: "Israel", KE: "Kenya", 
            GH: "Ghana", TZ: "Tanzania", MA: "Morocco", TN: "Tunisia", 
            SN: "Senegal", CI: "Ivory Coast", CM: "Cameroon",
            BW: "Botswana"  // Adicionado Botswana
        };

        // Resto do código original mantido...

        async function init() {
            navigator.geolocation.getCurrentPosition(async pos => {
                const {latitude: lat, longitude: lon} = pos.coords;
                const d = await fetchW(lat, lon);
                localData = d;
                let name = "Your location";
                try {
                    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1`);
                    const j = await r.json();
                    if (j.results?.[0]) {
                        name = j.results[0].name;
                        // Adiciona país se disponível
                        if (j.results[0].country_code) {
                            const countryName = COUNTRY_NAMES[j.results[0].country_code.toUpperCase()] || j.results[0].country_code;
                            name += `, ${countryName}`;
                        }
                    }
                } catch {}
                document.getElementById('local-info').innerHTML = `<span class="pulse-dot"></span> <span class="loc-name">📍 ${name}</span>`;
                refreshLocalBar();
            }, () => {
                document.getElementById('local-info').innerHTML = '📍 Enable GPS for local weather';
            });

            // Resto do código original de init()
        }
    </script>
</body>
</html>
